<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stylish Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#0f172a,#1d4ed8,#0ea5e9);
            padding:20px;
        }

        .login-box{
            width:100%;
            max-width:390px;
            padding:40px 32px;
            border-radius:22px;

            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,0.25);

            box-shadow:
            0 20px 50px rgba(0,0,0,0.30);

            color:white;
        }

        .logo{
            width:70px;
            height:70px;
            margin:0 auto 18px;

            display:flex;
            align-items:center;
            justify-content:center;

            border-radius:50%;
            background:white;
            color:#2563eb;

            font-size:28px;
            font-weight:bold;

            box-shadow:0 10px 25px rgba(0,0,0,0.20);
        }

        .login-box h2{
            text-align:center;
            font-size:30px;
            margin-bottom:8px;
        }

        .subtitle{
            text-align:center;
            color:#e2e8f0;
            font-size:14px;
            margin-bottom:30px;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            color:#f8fafc;
        }

        .input-group input{
            width:100%;
            padding:14px 15px;

            border:none;
            outline:none;
            border-radius:10px;

            background:rgba(255,255,255,0.18);
            color:white;

            font-size:15px;

            border:1px solid rgba(255,255,255,0.20);

            transition:0.3s;
        }

        .input-group input::placeholder{
            color:#dbeafe;
        }

        .input-group input:focus{
            background:rgba(255,255,255,0.25);
            border-color:white;

            box-shadow:
            0 0 0 3px rgba(255,255,255,0.10);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:25px;
            font-size:13px;
        }

        .remember{
            display:flex;
            align-items:center;
            gap:7px;
        }

        .options a{
            color:white;
            text-decoration:none;
        }

        .options a:hover{
            text-decoration:underline;
        }

        .login-btn{
            width:100%;
            padding:14px;

            border:none;
            border-radius:10px;

            background:white;
            color:#1d4ed8;

            font-size:16px;
            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{
            transform:translateY(-2px);

            box-shadow:
            0 10px 25px rgba(0,0,0,0.25);
        }

        .bottom-text{
            margin-top:25px;
            text-align:center;
            font-size:13px;
            color:#dbeafe;
        }

        .bottom-text a{
            color:white;
            font-weight:bold;
            text-decoration:none;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

        @media(max-width:450px){

            .login-box{
                padding:32px 22px;
            }

            .login-box h2{
                font-size:26px;
            }

            .options{
                flex-direction:column;
                align-items:flex-start;
                gap:10px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            L
        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Please login to continue
        </p>

        <form>

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="options">

                <label class="remember">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <div class="bottom-text">

            Don't have an account?

            <a href="#">
                Register
            </a>

        </div>

    </div>

</body>
</html>
